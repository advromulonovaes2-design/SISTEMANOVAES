<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Envio de documentos · Palha Novaes Advocacia</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#161817">
<link rel="icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#F3EFE7;--surface:#FFFFFF;--ink:#161817;--muted:#5E5A52;--line:#DED6C6;--gold:#7D612C;--ok:#067647;--ok-soft:#DFF4E8;--warn:#A64B00;--warn-soft:#FCEFD9;--pri:#161817;--pri-ink:#F3EFE7;
  --f-display:"Spectral",Georgia,serif;--f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121312;--surface:#1B1C1B;--ink:#F3EFE7;--muted:#A9A397;--line:#32332F;--gold:#C6A66B;--ok:#4FD08F;--ok-soft:#14321F;--warn:#F5B041;--warn-soft:#3A2A12;--pri:#C6A66B;--pri-ink:#161817;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
header img{width:44px;height:44px;border-radius:10px}
header b{font-family:var(--f-display);font-size:20px;font-weight:600;display:block;line-height:1.2}
header span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.2;margin:0 0 6px;text-wrap:balance}
p{margin:0 0 14px;color:var(--muted)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.item .top{display:flex;align-items:flex-start;gap:10px}
.item .nm{flex:1;font-weight:600;line-height:1.35}
.st{font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.st.ok{background:var(--ok-soft);color:var(--ok)}.st.pend{background:var(--warn-soft);color:var(--warn)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn[disabled]{opacity:.6}
.prog{font-size:13px;color:var(--muted)}
.aviso{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:18px}
.erro{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:12px 14px;font-size:14.5px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="icone-192.png" alt=""><div><b id="esc">Palha Novaes Advocacia</b><span>Envio de documentos</span></div></header>
  <main id="tela"><p>Carregando…</p></main>
  <div class="aviso">Os arquivos vão direto para o escritório, numa pasta protegida. Só a equipe do escritório consegue ver. Você pode mandar foto (pode ser da câmera) ou PDF.</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="imagem.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=new URLSearchParams(location.search).get('t')||'';
let sb=null,info=null;const enviados={};
function tela(html){$('#tela').innerHTML=html;}
function render(){
  const itens=[...(info.itens||[]),{k:'outro',l:'Outro documento (o que o escritório pediu por mensagem)'}];
  (info.enviados||[]).forEach(e=>{enviados[e.item]=(enviados[e.item]||0)+1;});
  const falta=itens.filter(i=>i.k!=='outro'&&!enviados[i.k]).length;
  tela(`<h1>Olá${info.cliente?', '+esc(info.cliente):''}!</h1>
    <p>${falta?`Faltam ${falta} ${falta===1?'documento':'documentos'}. Toque em cada um para tirar a foto ou escolher o arquivo.`:'Recebemos tudo o que estava na lista. Obrigado! Se precisar mandar mais alguma coisa, use “Outro documento”.'}</p>
    ${itens.map(i=>`<div class="item" id="it-${esc(i.k)}"><div class="top"><span class="nm">${esc(i.l)}</span>${enviados[i.k]?`<span class="st ok">Enviado${enviados[i.k]>1?' ('+enviados[i.k]+')':''}</span>`:i.k!=='outro'?'<span class="st pend">Falta</span>':''}</div>
      <button class="btn ${enviados[i.k]?'':'pri'}" type="button" data-k="${esc(i.k)}" data-l="${esc(i.l)}">${enviados[i.k]?'Enviar mais uma foto ou página':'Enviar foto ou PDF'}</button><span class="prog" hidden></span></div>`).join('')}
    <p style="margin-top:14px;font-size:13.5px">Este link vale até ${new Date(info.expira).toLocaleDateString('pt-BR')}.</p>`);
}
function escolher(){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept='image/*,application/pdf';i.multiple=true;i.onchange=()=>res([...(i.files||[])]);i.click();});}
async function enviar(k,l,btn){
  const fs=await escolher();if(!fs.length)return;
  const prog=btn.nextElementSibling;prog.hidden=false;btn.disabled=true;let ok=0;
  for(let n=0;n<fs.length;n++){
    prog.textContent=`Enviando ${n+1} de ${fs.length}…`;
    try{
      let f=await prepararArquivo(fs[n]);
      if(f.size>15*1024*1024){prog.textContent='Arquivo grande demais (máximo 15 MB). Tire outra foto ou mande um PDF menor.';continue;}
      const ext=((f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5))||'jpg';
      const path=`${token}/${k}-${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
      const up=await sb.storage.from('envios').upload(path,f,{contentType:f.type||'application/octet-stream',upsert:false});
      if(up.error)throw up.error;
      const r=await sb.rpc('envio_registrar',{p_token:token,p_item:k,p_rotulo:l,p_caminho:path,p_nome:f.name||'',p_tamanho:f.size});
      if(r.error||r.data!==true)throw new Error('registro');
      ok++;(info.enviados=info.enviados||[]).push({item:k});
    }catch(e){console.error(e);prog.textContent='Não deu para enviar. Confira a internet e tente de novo.';btn.disabled=false;if(!ok)return;}
  }
  Object.keys(enviados).forEach(x=>delete enviados[x]);render();
  const box=document.getElementById('it-'+k);if(box){const p=box.querySelector('.prog');p.hidden=false;p.textContent=ok===1?'Recebido! Obrigado.':`${ok} arquivos recebidos. Obrigado!`;}
}
async function iniciar(){
  const C=window.CONFIG||{};
  if(!window.supabase||!C.SUPABASE_URL||/COLE-AQUI/.test(C.SUPABASE_URL)){tela('<div class="erro">Página ainda não configurada pelo escritório.</div>');return;}
  if(!/^[0-9a-f-]{36}$/i.test(token)){tela('<div class="erro">Este link está incompleto. Abra de novo o link que o escritório mandou.</div>');return;}
  sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY,{auth:{persistSession:false}});
  const r=await sb.rpc('envio_info',{p_token:token});
  if(r.error||!r.data){tela('<div class="erro">Este link venceu ou foi desativado. Peça um novo ao escritório.</div>');return;}
  info=r.data;if(info.escritorio)$('#esc').textContent=info.escritorio;document.title='Envio de documentos · '+(info.escritorio||'');
  render();
}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(b)enviar(b.dataset.k,b.dataset.l,b);});
iniciar();
</script>
</body>
</html>
