<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Acompanhamento do processo · Palha Novaes Advocacia</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#161817">
<link rel="icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#F3EFE7;--surface:#FFFFFF;--ink:#161817;--muted:#5E5A52;--line:#DED6C6;--gold:#7D612C;--ok:#067647;--ok-soft:#DFF4E8;--warn:#A64B00;--warn-soft:#FCEFD9;
  --f-display:"Spectral",Georgia,serif;--f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121312;--surface:#1B1C1B;--ink:#F3EFE7;--muted:#A9A397;--line:#32332F;--gold:#C6A66B;--ok:#4FD08F;--ok-soft:#14321F;--warn:#F5B041;--warn-soft:#3A2A12;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:600px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
header img{width:44px;height:44px;border-radius:10px}
header b{font-family:var(--f-display);font-size:20px;font-weight:600;display:block;line-height:1.2}
header span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.2;margin:0 0 6px;text-wrap:balance}
p{margin:0 0 14px;color:var(--muted)}
.proc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14.5px;font-weight:600;word-break:break-all}
.tag{display:inline-block;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--warn-soft);color:var(--warn);margin:0 6px 6px 0}
.fase{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:10px}
.fase b{display:block;font-size:18px;color:var(--ink);text-transform:none;letter-spacing:0;font-family:var(--f-display);font-weight:600}
.mov{margin-top:10px;font-size:14.5px}
.mov small{display:block;color:var(--muted);font-size:13px}
.comp{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.comp div{display:flex;gap:10px;align-items:baseline;margin-top:6px;font-size:14.5px}
.comp time{font-weight:600;white-space:nowrap}
.aviso{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:18px}
.erro{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:12px 14px;font-size:14.5px}
a{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="icone-192.png" alt=""><div><b id="esc">Palha Novaes Advocacia</b><span>Acompanhamento</span></div></header>
  <main id="tela"><p>Carregando…</p></main>
  <div class="aviso">Estas informações são atualizadas pelo escritório e pelo sistema dos tribunais, e podem levar alguns dias para aparecer aqui. Prazos e detalhes do caso, converse com seu advogado.</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=new URLSearchParams(location.search).get('t')||'';
const dataBR=d=>{if(!d)return'';const x=new Date(String(d).length===10?d+'T12:00:00':d);return x.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});};
const diaSemana=d=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
function tela(h){$('#tela').innerHTML=h;}
async function iniciar(){
  const C=window.CONFIG||{};
  if(!window.supabase||!C.SUPABASE_URL||/COLE-AQUI/.test(C.SUPABASE_URL))return tela('<div class="erro">Página ainda não configurada pelo escritório.</div>');
  if(!/^[0-9a-f-]{36}$/i.test(token))return tela('<div class="erro">Este link está incompleto. Abra de novo o link que o escritório mandou.</div>');
  const sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY,{auth:{persistSession:false}});
  const r=await sb.rpc('acompanhamento_info',{p_token:token});
  if(r.error||!r.data)return tela('<div class="erro">Este link foi desativado. Peça um novo ao escritório.</div>');
  const d=r.data;if(d.escritorio){$('#esc').textContent=d.escritorio;document.title='Acompanhamento · '+d.escritorio;}
  const ps=d.processos||[];
  tela(`<h1>Olá${d.cliente?', '+esc(d.cliente):''}!</h1>
    <p>${ps.length?`Aqui está a situação ${ps.length===1?'do seu processo':'dos seus processos'} no escritório.`:'Ainda não há processo cadastrado para você. Assim que houver, ele aparece aqui.'}</p>
    ${ps.map(p=>`<div class="proc">
      ${p.area?`<span class="tag">${esc(p.area)}</span>`:''}${p.especie?`<span class="tag">${esc(p.especie)}</span>`:''}
      <div class="num">${esc(p.numero||'Número ainda não informado')}</div>
      ${p.tribunal||p.vara?`<div style="font-size:14px;color:var(--muted)">${esc([p.tribunal,p.vara].filter(Boolean).join(' · '))}</div>`:''}
      <div class="fase">Fase<b>${esc(p.fase||'Em andamento')}</b></div>
      ${p.movimento?`<div class="mov">Última movimentação: ${esc(p.movimento)}<small>em ${esc(dataBR(p.movimento_data))}</small></div>`:''}
      ${(p.compromissos||[]).length?`<div class="comp"><b style="font-size:14px">Próximos compromissos</b>${p.compromissos.map(c=>`<div><time>${esc(diaSemana(c.data))} ${esc(dataBR(c.data))}${c.hora?' às '+esc(c.hora):''}</time><span>${esc(c.tipo||'')}${c.modalidade?' · '+esc(c.modalidade):''}${c.local?' · '+esc(c.local):''}</span></div>`).join('')}</div>`:''}
    </div>`).join('')}
    ${d.telefone?`<p style="margin-top:14px">Dúvidas? Fale com o escritório: <a href="tel:${esc(String(d.telefone).replace(/[^\d+]/g,''))}">${esc(d.telefone)}</a></p>`:''}`);
}
iniciar();
</script>
</body>
</html>
